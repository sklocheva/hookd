# Sveltia CMS — admin panel at /admin
#
# The fields here mirror the Zod schemas in src/content.config.ts. When you change one,
# change the other: the schema is the enforcement (the build fails), this file is the
# form. Fields marked `required: true` here are the ones Zod would reject, so the panel
# asks at write time instead of the build failing afterwards.

# The deployed site. Without this the panel has nowhere to link an entry to, which is why
# there was no way out of /admin to look at a page.
#
# Drafts render on the site — they are only kept out of search, the sitemap and the feed —
# so this link is a real preview: save, follow it, and the draft banner at the top of the
# page tells you whether the build has caught up with your save yet.
#
# ⚠ Changing the domain means changing this, `site` in astro.config.mjs, and the Sitemap:
# line in public/robots.txt. All three, together.
site_url: https://hookd-blog.sklocheva.workers.dev
display_url: https://hookd-blog.sklocheva.workers.dev

backend:
  name: github
  repo: sklocheva/hookd
  branch: main
  # Authorization Code Flow needs an OAuth client — see README "Publishing from the browser".
  # Until one is deployed, sign in with a Personal Access Token instead, which needs no setup.
  # base_url: https://<your-auth-worker>.workers.dev

# Uploads land in src/assets/ so Astro can optimize them at build, rather than in
# public/ where they would be served untouched.
#
# public_folder is the path written into frontmatter. Sveltia requires an absolute
# path starting with "/" — a relative one is rejected outright — so entries store
# "/src/assets/<file>" and src/lib/images.ts resolves that to a real asset for
# <Image>. See the comment there for why the resolver exists.
media_folder: /src/assets
public_folder: /src/assets

media_libraries:
  all:
    # House rule: nothing above 2000px on the long edge gets committed, because git keeps
    # every version of every binary forever. Sveltia resizes in the browser before upload,
    # so the oversized original never enters the repo at all.
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2000
        height: 2000

collections:
  # ---------------------------------------------------------------- patterns
  #
  # Field order follows the work: what the pattern is, then the yarn and the making, then
  # the instructions, then photos, links, dates, and last the search-and-sharing settings
  # nobody needs while writing. Hints say what to type, in plain words; the reasons behind
  # a rule live in comments here and in CLAUDE.md, not in front of the author. Four
  # first-time testers drove this form on 22 Oct 2026 — see CLAUDE.md.
  - name: patterns
    label: Patterns
    label_singular: Pattern
    folder: src/content/patterns
    create: true
    extension: mdx
    format: frontmatter
    slug: '{{fields.title | slugify}}'
    summary: "{{title}} — {{difficulty}}{{draft | ternary(' · Draft', '')}}"
    # The "view on site" link. It points at /go/<previewId>/ rather than at the page,
    # because preview_path is one template per collection and cannot ask whether the
    # entry is a draft: a link to the preview address would break on publishing, and a
    # link to the real slug would break while the entry was still a draft. /go/ forwards
    # to whichever of the two is live right now. See src/pages/go/[id].astro.
    preview_path: go/{{fields.previewId}}
    fields:
      - { label: Title, name: title, widget: string }
      # On by default: a new entry that is saved without a second look must not publish.
      # It started off, and two testers found it would have published on first save.
      - label: Draft
        name: draft
        widget: boolean
        default: true
        hint: >-
          Leave this on while you work: a draft is hidden from every list on the site.
          Switch it off when the pattern is ready to publish.
      - label: Summary
        name: summary
        widget: text
        hint: One or two sentences under the title, saying what the pattern makes.
      - label: Publish date
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        hint: Needed to save. Click Today; you can change it when you publish.
      - label: Search description
        name: metaDescription
        widget: string
        required: true
        pattern: ['^.{1,160}$', 'Must be 160 characters or fewer.']
        hint: Needed to save. What search engines show under the title, up to 160 characters. Pasting the summary is fine.
      - label: Introduction
        name: body
        widget: markdown
        required: false
        hint: >-
          The text above the pattern: what it is, why you made it, anything a maker should
          know before starting. Optional.

      # --- What it is -----------------------------------------------------
      - label: Difficulty
        name: difficulty
        widget: select
        options: [Basic, Easy, Intermediate, Complex]
        hint: Craft Yarn Council's four levels. Colour changes count as colour work, so Easy at least.
      # Several per pattern — a hooded scarf is both clothing and an accessory. Stored as
      # lowercase slugs; the labels a reader sees live in src/lib/taxonomy.ts.
      - label: Type
        name: category
        widget: select
        multiple: true
        required: true
        min: 1
        options:
          - { label: Clothing, value: clothing }
          - { label: Accessories, value: accessories }
          - { label: Pets, value: pets }
          - { label: Home, value: home }
        hint: Pick every one that applies — a hooded scarf is both clothing and an accessory.
      - label: Tags
        name: tags
        widget: list
        required: false
        hint: A few lowercase words, e.g. shawl, colour blocks. Used to suggest related pages.

      # --- Yarn. One row per yarn line; its colours are listed inside it. ----
      - label: Yarns
        name: yarns
        widget: list
        label_singular: Yarn
        summary: '{{fields.brand}} {{fields.line}}'
        hint: One entry per yarn. Two colours of the same yarn are one entry, with both colours listed in it. How much yarn goes under Sizes.
        fields:
          - { label: Brand, name: brand, widget: string, hint: 'e.g. DROPS' }
          - { label: Yarn name, name: line, widget: string, hint: 'e.g. Melody' }
          - { label: Fibre content, name: fibreContent, widget: string, hint: 'e.g. 71% alpaca, 25% wool, 4% polyamide' }
          - { label: Ball weight (g), name: ballWeightG, widget: number, value_type: int }
          - { label: Ball length (m), name: ballLengthM, widget: number, value_type: int }
          # The number only. The name is looked up in src/lib/cyc.ts, so it cannot
          # disagree with the number the way the old free-text name field did.
          - label: Weight (Craft Yarn Council)
            name: cycWeight
            widget: select
            options:
              - { label: '0 – Lace', value: 0 }
              - { label: '1 – Super Fine (fingering, sock)', value: 1 }
              - { label: '2 – Fine (sport)', value: 2 }
              - { label: '3 – Light (DK)', value: 3 }
              - { label: '4 – Medium (worsted, aran)', value: 4 }
              - { label: '5 – Bulky (chunky)', value: 5 }
              - { label: '6 – Super Bulky', value: 6 }
              - { label: '7 – Jumbo', value: 7 }
          - label: Colours
            name: colours
            widget: list
            required: false
            label_singular: Colour
            summary: '{{fields.name}}'
            hint: Each colour used.
            fields:
              - { label: Colour, name: name, widget: string, hint: 'With its number, e.g. Dark Jeans Blue (07).' }
              - { label: Grams used, name: grams, widget: number, value_type: int, required: false, hint: Only if you weighed this colour on its own. }
          - label: Role
            name: role
            widget: string
            required: false
            hint: Only when the pattern uses two different yarns — main, contrast, edging. Empty means main.

      # --- Hook ----------------------------------------------------------
      # Only the mm is typed. The US size is looked up from it at build time
      # (src/lib/hooks.ts) because letters vary by manufacturer, and 2.5, 7 and 12 mm
      # have no US equivalent at all — a field for it invites an invented answer.
      - label: Hook (mm)
        name: hookMm
        widget: number
        value_type: float
        hint: The US size is added for you where one exists.
      - { label: Second hook (mm), name: secondHookMm, widget: number, value_type: float, required: false }
      - { label: Second hook used for, name: secondHookFor, widget: string, required: false, hint: 'e.g. bands and cuffs' }

      # --- Gauge. Measured on the actual piece, after blocking. -----------
      - label: Gauge
        name: gauge
        widget: object
        collapsed: false
        hint: Stitches and rows across a measured square, counted in the middle of the piece.
        fields:
          - { label: Stitches, name: stitches, widget: number, value_type: float }
          - { label: Rows, name: rows, widget: number, value_type: float }
          - { label: Measured over (cm), name: overCm, widget: number, value_type: float, hint: 'The side of the square you measured, e.g. 10 for 10 × 10 cm.' }
          - { label: Stitch pattern, name: stitchPattern, widget: string, hint: 'The stitch you measured in, e.g. dc' }
          - label: Blocked
            name: blocked
            widget: boolean
            default: false
            hint: Switch on only if you measured after washing or blocking. Not blocked yet? Leave it off and update it later.
          - label: Note
            name: note
            widget: string
            required: false
            hint: Where and how you measured — it tells a maker how to swatch to match your number.

      # --- Sizes. Structured, so the table is generated. ------------------
      - label: Sizes
        name: sizes
        widget: list
        label_singular: Size
        summary: '{{fields.name}} — {{fields.grams}} g'
        hint: One entry per size. A one-size piece has one entry, named One size.
        fields:
          - { label: Size name, name: name, widget: string, hint: 'XS, M, 3X, or One size' }
          - label: Fits body (cm) — garments only
            name: fitsBodyCm
            widget: string
            required: false
            hint: The body this size is cut for, e.g. 76–81. Leave empty for accessories.
          - label: Finished measurements
            name: measurements
            widget: list
            required: false
            label_singular: Measurement
            summary: '{{fields.label}} — {{fields.value}} {{fields.unit}}'
            hint: >-
              Name each one yourself — width and length for a shawl, bust and length for a
              sweater. Use the same names in every size.
            fields:
              - { label: Measurement, name: label, widget: string, hint: 'e.g. Width' }
              - { label: Value, name: value, widget: number, value_type: float, hint: 'In the unit below — usually cm.' }
              - { label: Unit, name: unit, widget: string, default: cm, required: false, hint: Usually cm. }
          # Grams, because grams are what the author weighs. Metres and yards are worked
          # out on the page from the main yarn's ball weight and length.
          - label: Yarn needed (g)
            name: grams
            widget: number
            value_type: int
            hint: Weigh the finished piece. Metres and yards are worked out for you.
          - label: Numbers for this size — several sizes only
            name: values
            widget: list
            required: false
            label_singular: Number
            summary: '{{fields.key}} = {{fields.value}}'
            hint: >-
              Skip for one size. Write the instruction once with a name in
              curly braces — "Ch {neckCh}" — and give each size its own number here.
            fields:
              - { label: Name, name: key, widget: string, hint: 'The name inside the braces, e.g. neckCh. No spaces.' }
              - { label: Number, name: value, widget: string, hint: 'This size''s number, e.g. 88, or a range like 12–14.' }
      - { label: Ease — garments only, name: ease, widget: string, required: false, hint: 'For garments, e.g. worn with 10–15 cm ease' }
      - label: How to choose a size — garments only
        name: sizeNote
        widget: text
        required: false
        hint: For garments — which measurement to go by, and what to do between two sizes.
      - label: Body measurement chart — garments only
        name: bodyChartUrl
        widget: string
        required: false
        default: https://www.craftyarncouncil.com/standards/body-sizing
        hint: Accessories ignore it. For a garment, leave it as it is unless you want to point somewhere else.

      # ------------------------------------------------------------ the pattern itself
      #
      # All optional: a pattern page is complete without any of it. One template covers
      # both designed variants — several sizes gets the sticky size picker, one size gets a
      # static band. Open by default: it holds every instruction, and closed behind a tick
      # box it read as an optional extra.
      #
      # Deliberately absent: schematic, stitch chart, photo tutorial. Those are the paid
      # PDF on Ravelry, and this is the free page.
      - label: The pattern
        name: instructions
        widget: object
        collapsed: false
        hint: The written instructions, section by section.
        fields:
          - label: How this pattern is written
            name: howWritten
            widget: list
            required: false
            label_singular: Entry
            summary: '{{fields.term}} — {{fields.definition}}'
            hint: 'Short reference lines, e.g. Topic: Terms · Note: US throughout.'
            fields:
              - { label: Topic, name: term, widget: string }
              - { label: Note, name: definition, widget: string }
          - label: Abbreviations
            name: abbreviations
            widget: list
            required: false
            label_singular: Abbreviation
            summary: '{{fields.term}} — {{fields.definition}}'
            fields:
              - { label: Abbreviation, name: term, widget: string, hint: 'e.g. BLO' }
              - { label: Meaning, name: definition, widget: string, hint: 'e.g. back loop only' }
          - label: Stitches to learn first
            name: specialStitches
            widget: list
            required: false
            label_singular: Stitch
            summary: '{{fields.label}}'
            hint: Stitches a maker might not know. Leave out plain sc and dc.
            fields:
              - { label: Name, name: label, widget: string }
              - { label: How to work it, name: body, widget: text }
          - label: Reassurance line
            name: specialStitchesNote
            widget: text
            required: false
            hint: An optional reassurance under the stitches, e.g. "Everything else is plain dc."
          - label: Sections
            name: sections
            widget: list
            required: false
            label_singular: Section
            summary: '{{fields.heading}}'
            hint: One per stage of the work — e.g. Blocks, End accent; or Yoke, Body, Sleeves.
            fields:
              - { label: Heading, name: heading, widget: string }
              - label: Intro
                name: intro
                widget: text
                required: false
                hint: Optional — one or two sentences on what this part makes.
              - label: Instructions
                name: rows
                widget: list
                required: false
                label_singular: Row
                summary: '{{fields.label}} — {{fields.text}}'
                fields:
                  - label: Label
                    name: label
                    widget: string
                    hint: 'Row 1, Rows 2–14, Each block, Each short end.'
                  - label: Instruction
                    name: text
                    widget: text
                    hint: >-
                      End with the stitch count in brackets where a maker could lose track,
                      e.g. (25). In a pattern with several sizes, use {names} for numbers that change.
              - label: Closing note
                name: note
                widget: text
                required: false
                hint: Optional — a caveat that isn't an instruction, set quietly under the rows.
              - label: Tip
                name: tip
                widget: object
                required: false
                collapsed: true
                hint: Optional — the one thing that goes wrong at this stage, and how to catch it.
                fields:
                  - { label: Lead, name: lead, widget: string, required: false, hint: 'A short bold opening, e.g. Count after the first block.' }
                  - { label: Tip, name: body, widget: text, required: false }
          - label: Finishing intro
            name: finishingIntro
            widget: text
            required: false
            hint: e.g. "Weave in ends." Optional.
          - label: Finishing steps
            name: finishing
            widget: list
            required: false
            label_singular: Step
            summary: '{{fields.label}}'
            hint: Only steps specific to this pattern, e.g. closing an underarm. Blocking and care belong on the yarn note.
            fields:
              - { label: Name, name: label, widget: string }
              - { label: How to do it, name: body, widget: text }
          - label: Default size
            name: defaultSize
            widget: string
            required: false
            hint: Several sizes only — which size the page shows first. Empty means the middle one.

      # --- Photos ----------------------------------------------------------
      - label: Hero image
        name: heroImage
        widget: image
        required: false
        hint: The main photo. Leave empty until you have one — the page shows "photography still to come".
      # Required to publish once there is a hero image, and not before — enforced in the
      # schema. It used to be required always, which asked for a photo that did not exist.
      - label: Hero image alt text
        name: heroImageAlt
        widget: string
        required: false
        hint: Needed once there is a hero image — describe what the photo shows, for someone who can't see it.
      - label: Hero caption
        name: heroImageCaption
        widget: string
        required: false
        hint: Optional line under the photo, e.g. "Shown in Dark Jeans Blue and Off White".
      - label: Shoot note
        name: heroImagePending
        widget: string
        required: false
        hint: Optional, shown while there is no photo, e.g. "Shoot booked · November".
      - label: More photographs
        name: gallery
        widget: list
        required: false
        label_singular: Photograph
        summary: '{{fields.alt}}'
        hint: Extra photos, shown with the main one.
        fields:
          - { label: Image, name: image, widget: image }
          - label: Alt text
            name: alt
            widget: string
            required: true
            hint: Describe what the photo shows, for someone who can't see it.
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: Optional — say something the photo can't, e.g. "Size M, worn with 12 cm ease".

      # --- Links -----------------------------------------------------------
      - { label: Ravelry link, name: ravelryUrl, widget: string, required: false, hint: Optional — the pattern's Ravelry page. }
      - { label: PDF link, name: pdfUrl, widget: string, required: false, hint: Optional — a paid PDF of this pattern, if there is one. }
      - label: Yarn test behind this pattern
        name: relatedPost
        widget: relation
        collection: posts
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        # Always a search box. The default threshold of 5 draws radios and checkboxes
        # below it, which reads as a broken control and does not survive twenty patterns.
        dropdown_threshold: 0
        required: false
        hint: Optional — the journal post your yarn advice comes from. Linked in the note on substituting yarn.
      # --- Read next. Optional: leave empty and the site picks by shared tags. ------
      - label: Read next — patterns
        name: relatedPatterns
        widget: relation
        collection: patterns
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        dropdown_threshold: 0
        multiple: true
        required: false
        hint: Optional — patterns to suggest at the end of the page. Empty means the site picks by tags.
      - label: Read next — journal posts
        name: relatedPosts
        widget: relation
        collection: posts
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        dropdown_threshold: 0
        multiple: true
        required: false
        hint: Optional — journal posts to suggest at the end of the page.

      # --- Dates -----------------------------------------------------------
      - label: Last corrected
        name: updated
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
        hint: Only when you fix something in a published pattern — a stitch count, a measurement.

      # --- Search and sharing. Rarely touched while writing. ----------------
      - label: Share picture
        name: socialImage
        widget: string
        required: true
        default: /og-default.png
        hint: The picture shown when someone shares the page. Leave it as it is for now.
      - label: Preview address
        name: previewId
        widget: uuid
        hint: Made for you. While this is a draft, the page lives at this hidden address instead of its real one.

  # ---------------------------------------------------------------- posts
  #
  # Same order as the pattern form: the writing first, then photos and links, then dates,
  # then search and sharing. The article body used to come last, after a dozen settings,
  # and a first-time tester concluded the form had nowhere to put the article.
  - name: posts
    label: Journal
    label_singular: Journal post
    folder: src/content/posts
    create: true
    extension: mdx
    format: frontmatter
    slug: '{{fields.title | slugify}}'
    summary: "{{title}} — {{kind}}{{draft | ternary(' · Draft', '')}}"
    # The "view on site" link. It points at /go/<previewId>/ rather than at the page,
    # because preview_path is one template per collection and cannot ask whether the
    # entry is a draft: a link to the preview address would break on publishing, and a
    # link to the real slug would break while the entry was still a draft. /go/ forwards
    # to whichever of the two is live right now. See src/pages/go/[id].astro.
    preview_path: go/{{fields.previewId}}
    fields:
      - { label: Title, name: title, widget: string }
      # On by default, as on every other form — it started off here too.
      - label: Draft
        name: draft
        widget: boolean
        default: true
        hint: >-
          Leave this on while you work: a draft is hidden from every list on the site.
          Switch it off when the post is ready to publish.
      - label: Summary
        name: summary
        widget: text
        hint: One or two sentences, shown under the title and in the journal list.
      - label: Publish date
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        hint: Needed to save. Click Today; you can change it when you publish.
      - label: Search description
        name: metaDescription
        widget: string
        required: true
        pattern: ['^.{1,160}$', 'Must be 160 characters or fewer.']
        hint: Needed to save. What search engines show under the title, up to 160 characters. Pasting the summary is fine.
      - label: Kind
        name: kind
        widget: select
        options: ['Garment making', 'Yarn notes', 'How-tos']
        hint: Which part of the journal this files under. Yarn notes here is a longer post about yarn; a note on one yarn goes in the Yarn notes section instead.
      - label: Article
        name: body
        widget: markdown
        hint: The post itself.
      - label: What I tested
        name: method
        widget: string
        required: false
        hint: 'Optional — one short line shown under the summary, e.g. "6 yarns · 32 sts × 24 rows hdc", or for one piece "One cat toy · leftover wool · 3.5 mm hook".'
      - label: Tags
        name: tags
        widget: list
        required: false
        hint: A few lowercase words, e.g. sweaters, top-down. Used to suggest related pages.

      # --- Photos ----------------------------------------------------------
      - label: Hero image
        name: heroImage
        widget: image
        required: false
        hint: Optional — the main photo, shown at the top of the post.
      # Required to publish once there is a hero image, and not before — enforced in the
      # schema. It used to be required always, which asked for a photo that did not exist.
      - label: Hero image alt text
        name: heroImageAlt
        widget: string
        required: false
        hint: Needed once there is a hero image — describe what the photo shows, for someone who can't see it.
      - label: More photographs
        name: gallery
        widget: list
        required: false
        label_singular: Photograph
        summary: '{{fields.alt}}'
        hint: Extra photos, shown together at the end of the post.
        fields:
          - { label: Image, name: image, widget: image }
          - label: Alt text
            name: alt
            widget: string
            required: true
            hint: Describe what the photo shows, for someone who can't see it.
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: 'Optional — say something the photo can''t, e.g. "Left: 7 stitches across. Right: 9."'

      # --- Read next. Optional: leave empty and the site picks by shared tags. ------
      - label: Read next — patterns
        name: relatedPatterns
        widget: relation
        collection: patterns
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        # Always a search box. The default threshold of 5 draws radios and checkboxes
        # below it, which reads as a broken control and does not survive twenty patterns.
        dropdown_threshold: 0
        multiple: true
        required: false
        hint: Optional — patterns to suggest at the end of the post. Empty means the site picks by tags.
      - label: Read next — journal posts
        name: relatedPosts
        widget: relation
        collection: posts
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        dropdown_threshold: 0
        multiple: true
        required: false
        hint: Optional — other posts to suggest at the end.

      # --- Dates -----------------------------------------------------------
      - label: Last updated
        name: updated
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
        hint: Only when you change a published post in a way a reader should know about.

      # --- Search and sharing. Rarely touched while writing. ----------------
      - label: Share picture
        name: socialImage
        widget: string
        required: true
        default: /og-default.png
        hint: The picture shown when someone shares the page. Leave it as it is for now.
      - label: Preview address
        name: previewId
        widget: uuid
        hint: Made for you. While this is a draft, the page lives at this hidden address instead of its real one.

  # ---------------------------------------------------------------- reviews
  # A yarn note is a spec sheet with a short essay at the end — the mirror of a test note,
  # which is an essay with tables in it. Hence its own collection: almost none of the
  # fields overlap. Called notes, not reviews: this is writing down what a yarn did.
  #
  # NOTHING here is required by the panel, so a half-filled draft always saves. What a
  # *published* note needs is enforced by the schema instead — see the superRefine in
  # src/content.config.ts. Switch Draft off and the build names anything still missing.
  # Groups are marked `required: false` so the panel draws no asterisk on them: a starred
  # group that saved empty taught a tester not to trust any asterisk.
  - name: reviews
    label: Yarn notes
    label_singular: Yarn note
    folder: src/content/reviews
    create: true
    extension: md
    format: frontmatter
    slug: '{{fields.title | slugify}}'
    summary: "{{title}}{{draft | ternary(' · Draft', '')}}"
    # The "view on site" link. It points at /go/<previewId>/ rather than at the page,
    # because preview_path is one template per collection and cannot ask whether the
    # entry is a draft: a link to the preview address would break on publishing, and a
    # link to the real slug would break while the entry was still a draft. /go/ forwards
    # to whichever of the two is live right now. See src/pages/go/[id].astro.
    preview_path: go/{{fields.previewId}}
    fields:
      - label: Yarn name
        name: title
        widget: string
        hint: As you would say it, e.g. Drops Alpaca.
      - label: Draft
        name: draft
        widget: boolean
        default: true
        hint: >-
          Leave this on while you work: a draft saves with whatever you have and is hidden
          from every list on the site. Switch it off when the note is ready — if anything
          needed to publish is missing, the site will say what.
      - label: In one or two sentences
        name: standfirst
        widget: text
        required: false
        hint: The answer — someone who reads only this should know whether to buy the yarn. Needed to publish.

      # --- Table 1: transcribed from the ball band and the shop. ---------
      #     Any row left empty simply does not appear on the page.
      - label: The ball band
        name: yarn
        widget: object
        required: false
        collapsed: false
        hint: Copy what the band says. Anything left empty simply doesn't appear on the page.
        fields:
          - { label: Brand, name: brand, widget: string, required: false, hint: 'e.g. Drops' }
          - { label: Yarn name, name: line, widget: string, required: false, hint: 'e.g. Alpaca' }
          - label: Fibre content
            name: content
            widget: string
            required: false
            hint: Just the fibres, e.g. 100% alpaca. Ply goes under Strand construction.
          - label: Weight, as the band says
            name: weightLabel
            widget: string
            required: false
            hint: Copy it as printed, e.g. Sport – Drops yarn group A.
          - label: Wraps per inch
            name: wpi
            widget: number
            value_type: float
            required: false
            hint: Optional — wrap the yarn round a ruler for an inch, without stretching or overlapping, and count.

          # How the strand is built. The type is a short fixed list so two notes can be
          # compared on it; the line carries what you actually see when you untwist it.
          - label: Strand construction
            name: construction
            widget: object
            required: false
            collapsed: false
            fields:
              - label: Type
                name: type
                widget: select
                required: false
                options:
                  - Singles
                  - Plied
                  - Cabled
                  - Chainette
                  - Roving
                hint: >-
                  Singles — one strand. Plied — strands twisted together. Cabled — plied
                  yarns twisted together again. Chainette — a knitted tube. Roving — barely twisted.
              - label: What you see
                name: note
                widget: text
                required: false
                hint: Untwist a length and describe it, e.g. "3 strands, tightly twisted".

          - { label: Ball weight (g), name: ballWeightG, widget: number, value_type: int, required: false }
          - label: Ball length (m)
            name: ballLengthM
            widget: number
            value_type: int
            required: false
            hint: Yards are worked out for you.
          - label: Gauge on the band
            name: ballBandGauge
            widget: string
            required: false
            hint: Copy it as printed, knitted figures and all.
          - label: Hook on the band
            name: hookOnLabel
            widget: string
            required: false
            hint: As printed, e.g. 3.5–4.5 mm.
          - label: Hook I used (mm)
            name: hookMm
            widget: number
            value_type: float
            required: false
            hint: In mm. The US size is added for you where one exists.
          - label: Grams per 10 × 10 cm
            name: gramsPer10cm
            widget: number
            value_type: float
            required: false
            hint: Optional — weigh your swatch. Squares per ball is worked out from it.
          - { label: Metres per 10 × 10 cm, name: metresPer10cm, widget: number, value_type: float, required: false, hint: Optional. }
          - { label: Care, name: care, widget: string, required: false, hint: 'As printed, e.g. Hand wash, max 30°C. Dry flat. Felts.' }

      # --- Where it comes from. Its own section, not five more fields buried at the
      #     bottom of a twenty-field yarn block where nobody could find them. ---
      - label: Where it comes from
        name: origin
        widget: object
        required: false
        collapsed: false
        hint: Whatever the band or shop says. Anything left empty doesn't appear.
        fields:
          - label: Fibre from
            name: fibreOrigin
            widget: string
            required: false
            hint: Name the fibre and the country, e.g. Alpaca from Peru.
          - label: Spun in
            name: madeIn
            widget: string
            required: false
            hint: e.g. Peru. Often a different country from the fibre.
          - label: OEKO-TEX® STANDARD 100 class
            name: oekoTexClass
            widget: number
            value_type: int
            min: 1
            max: 4
            required: false
            hint: >-
              1 = babies and children to 3 · 2 = direct skin contact · 3 = no direct skin
              contact · 4 = decoration. Empty if the band doesn't say.
          - label: Also claimed
            name: certifications
            widget: select
            multiple: true
            required: false
            options:
              - GOTS
              - RWS
              - Mulesing-free
              - Recycled
              - Undyed
            hint: Tick only what the label or shop actually says. An unticked box shows nothing.

      # --- Price as a position, never a figure. --------------------------
      - label: Price
        name: price
        widget: object
        required: false
        collapsed: false
        fields:
          - { label: 'Price level (1 = budget, 5 = premium)', name: level, widget: number, value_type: int, min: 1, max: 5, required: false, hint: Where it sits in the market — never a price, which changes. }
          - label: Why
            name: note
            widget: string
            required: false
            hint: One line, e.g. Often on sale in autumn and winter.

      # --- The gauge panel: only ever unblocked vs blocked. --------------
      - label: My gauge
        name: gauge
        widget: object
        required: false
        collapsed: false
        hint: Your swatch, over 10 × 10 cm, before and after washing. Leave empty until you've swatched. Needed to publish.
        fields:
          - { label: Unblocked, name: unblocked, widget: string, required: false, hint: 'Stitches × rows, e.g. 17.5 × 11' }
          - { label: Blocked, name: blocked, widget: string, required: false, hint: 'After washing, e.g. 16.5 × 10.5' }
          - label: How you measured
            name: method
            widget: string
            required: false
            hint: e.g. Over 10 × 10 cm · hdc · 4 mm hook
          - { label: What the change means, name: note, widget: text, required: false, hint: Optional — e.g. "Grows a little in length; size down for a garment." }

      # --- Table 2: the same six judgements on every note. ---------------
      - label: What these notes are based on
        name: inTheHandBasis
        widget: string
        required: false
        hint: e.g. One swatch and one jumper, started 3 Sept 2026.
      - label: In the hand
        name: inTheHand
        widget: object
        required: false
        collapsed: false
        hint: >-
          Six scores from 1 to 5, each with one sentence saying why. All six are needed to
          publish, so two yarns can be compared.
        fields:
          - label: Stitch definition
            name: stitchDefinition
            widget: object
            required: false
            collapsed: false
            hint: 1 = stitches blur · 5 = every stitch crisp
            fields:
              - { label: Score, name: score, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: Why, name: note, widget: string, required: false }
          - label: Split resistance
            name: splitResistance
            widget: object
            required: false
            collapsed: false
            hint: 1 = splits badly · 5 = never splits
            fields:
              - { label: Score, name: score, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: Why, name: note, widget: string, required: false }
          - label: Softness
            name: softness
            widget: object
            required: false
            collapsed: false
            hint: 1 = harsh · 5 = very soft in the hand
            fields:
              - { label: Score, name: score, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: Why, name: note, widget: string, required: false }
          - label: Next to skin
            name: nextToSkin
            widget: object
            required: false
            collapsed: false
            hint: 1 = prickly · 5 = fine against a neck. Not the same as softness — a soft yarn can still scratch.
            fields:
              - { label: Score, name: score, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: Why, name: note, widget: string, required: false }
          - label: Drape
            name: drape
            widget: object
            required: false
            collapsed: false
            hint: 1 = structured, holds its shape · 5 = fluid, flows. Neither end is better.
            fields:
              - { label: Score, name: score, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: Why, name: note, widget: string, required: false }
          - label: Frogging
            name: frogging
            widget: object
            required: false
            collapsed: false
            hint: 1 = hard to rip back · 5 = rips back cleanly
            fields:
              - { label: Score, name: score, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: Why, name: note, widget: string, required: false }

      - label: Your notes
        name: body
        widget: markdown
        required: false
        hint: >-
          A paragraph or two: how the yarn behaves, and what to use it for and what not.
          If you wrote a longer test post about it, link it here.

      # --- Photos. Both optional even when published: a note with neither is a finished
      #     page, and early notes go out before any shoot. ---------------------------
      - { label: Yarn photo, name: heroImage, widget: image, required: false, hint: Optional. }
      - label: Yarn photo alt text
        name: heroImageAlt
        widget: string
        required: false
        hint: Needed once there is a yarn photo — describe what it shows, for someone who can't see it.
      - label: Yarn photo caption
        name: heroImageCaption
        widget: string
        required: false
        hint: Optional, e.g. Shade 118, one 50 g ball.
      - { label: Swatch photo, name: swatchImage, widget: image, required: false, hint: Optional. }
      - { label: Swatch photo alt text, name: swatchImageAlt, widget: string, required: false, hint: Needed once there is a swatch photo. }
      - { label: Swatch photo caption, name: swatchImageCaption, widget: string, required: false, hint: Optional. }

      # --- Dates -----------------------------------------------------------
      - label: Publish date
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        hint: The date shown on the page. Click Today; you can change it when you publish.
      - label: Last corrected
        name: updated
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
        hint: Only when you correct a published note.

      # --- Search and sharing. Required to publish, not to save. -----------
      - label: Search description
        name: metaDescription
        widget: string
        required: false
        pattern: ['^.{0,160}$', 'Must be 160 characters or fewer.']
        hint: What search engines show under the title. Up to 160 characters. Needed to publish.
      - label: Share picture
        name: socialImage
        widget: string
        required: false
        default: /og-default.png
        hint: The picture shown when someone shares the page. Leave it as it is for now.
      - label: Preview address
        name: previewId
        widget: uuid
        hint: Made for you. While this is a draft, the page lives at this hidden address instead of its real one.

  # ---------------------------------------------------------------- quizzes
  #
  # A quiz is structured data, not prose, so it is stored as JSON with no body — which is
  # why this collection sets `format: json` where the other three use frontmatter.
  #
  # The scoring model, because the form only makes sense once you have it: a quiz has a
  # few named outcomes, and every answer hands points to the outcomes it argues for. The
  # totals are added up across all the questions and the highest wins.
  #
  # There is no single running score, and the outcomes are deliberately not in an order.
  # A middle outcome is not "halfway between" the other two — it is a different claim, so
  # it gets its own tally that only rises when an answer actually argues for it. Score a
  # quiz on one summed number instead and the middle result becomes whatever the average
  # lands on, which is how someone answering strongly at both extremes ends up being told
  # the moderate thing.
  #
  # The answer IDs are typed twice — once on the answer, once on every score that points
  # at it. A dropdown of the answers would be better, but Sveltia cannot point a field at a
  # sibling list inside the same entry. A typo fails the build and names the question and
  # option, so it is safe; the hints say exactly where to copy the tag from.
  - name: quizzes
    label: Quizzes
    label_singular: Quiz
    folder: src/content/quizzes
    create: true
    extension: json
    format: json
    slug: '{{fields.title | slugify}}'
    summary: "{{title}}{{draft | ternary(' · Draft', '')}}"
    # As everywhere else: /go/<previewId>/ forwards to wherever the entry currently lives,
    # which is the only link that survives publishing. See src/pages/go/[id].astro.
    preview_path: go/{{fields.previewId}}
    fields:
      - label: Title
        name: title
        widget: string
        hint: The question the quiz answers, as a reader would ask it, e.g. Which first sweater should you make?
      - label: Draft
        name: draft
        widget: boolean
        default: true
        hint: >-
          Leave this on while you work: a draft is hidden from every list on the site.
          Switch it off when the quiz is ready to publish.
      - label: Intro paragraph
        name: standfirst
        widget: text
        hint: Under the title. Say what the quiz is for and which answers it can give.
      - label: Publish date
        name: date
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        hint: Needed to save. Click Today; you can change it when you publish.
      - label: Search description
        name: metaDescription
        widget: string
        required: true
        pattern: ['^.{0,160}$', 'Must be 160 characters or fewer.']
        hint: Needed to save. What search engines show under the title, up to 160 characters. Pasting the summary is fine.
      - label: Extra line under the intro
        name: intro
        widget: text
        required: false
        hint: >-
          Optional. The page already says "Nothing is saved and there is no email box at
          the end" — add only what goes after it, e.g. a nudge to answer honestly.

      # --- the answers ----------------------------------------------------
      #
      # Written before the questions on purpose: every question scores towards these, so
      # there is nothing to score until they exist.
      - label: Possible answers
        name: outcomes
        widget: list
        label_singular: Answer
        summary: '{{fields.id}} — {{fields.name}}'
        hint: >-
          The results someone can end up with — at least two. If two tie, the one listed
          first wins, so put your safest suggestion first.
        fields:
          - label: Name
            name: name
            widget: string
            hint: 'The result heading the reader sees, ending in a full stop, e.g. Top-down raglan.'
          - label: Tag
            name: id
            widget: string
            pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only.']
            hint: 'A short lowercase word for this answer, e.g. raglan. Never shown — you type it again in the questions to give it points.'
          - label: One-line verdict
            name: line
            widget: string
            hint: One sentence under the name, e.g. Try it on as you go.
          - label: More detail
            name: body
            widget: text
            required: false
            hint: Optional — a paragraph explaining the answer to the person who got it.
          - label: What to do next
            name: steps
            widget: list
            required: false
            field: { label: Step, name: step, widget: string }
            hint: Optional numbered steps.

      # --- the questions --------------------------------------------------
      - label: Questions
        name: questions
        widget: list
        label_singular: Question
        summary: '{{fields.q}}'
        fields:
          - { label: Question, name: q, widget: string }
          - label: Note
            name: note
            widget: string
            required: false
            hint: Optional small line under the question.
          - label: Photo
            name: image
            widget: image
            required: false
            hint: Optional — for questions about something you can see, e.g. "which fibre is this?".
          - label: Photo description (alt text)
            name: imageAlt
            widget: string
            required: false
            hint: >-
              Needed once there is a photo. Describe what is visible, never the answer — "a
              hairy, slightly shiny yarn", not "mohair", or a screen reader gives it away.
          - label: Options
            name: options
            widget: list
            label_singular: Option
            summary: '{{fields.label}}'
            hint: Two to five. Picking one moves the reader straight on.
            fields:
              - { label: Option, name: label, widget: string }
              - label: Sub-line
                name: sub
                widget: string
                required: false
                hint: Optional smaller line inside the option.
              - label: Points
                name: score
                widget: list
                label_singular: Points for an answer
                summary: '{{fields.outcome}} +{{fields.points}}'
                hint: >-
                  Which answers this option argues for. One row per answer — most options need
                  one. An answer not listed gets nothing from this option.
                fields:
                  - label: Answer tag
                    name: outcome
                    widget: string
                    pattern: ['^[a-z0-9-]+$', 'Lowercase letters, numbers and hyphens only.']
                    hint: The Tag from Possible answers, typed exactly the same, e.g. raglan.
                  - label: Points
                    name: points
                    widget: number
                    value_type: int
                    default: 1
                    hint: 1 for a hint, 2 or 3 for a clear signal. Keep it small.

      # --- how it shows up elsewhere --------------------------------------
      - label: Journal list teaser
        name: teaser
        widget: text
        hint: The line under the quiz in the journal list. Your intro's first sentence often works.
      - label: Short teaser for articles
        name: calloutTeaser
        widget: text
        required: false
        hint: Optional, shorter — used when the quiz is suggested inside an article. Empty uses the journal list teaser.
      - label: Tile caption
        name: tileCaption
        widget: string
        required: false
        hint: Optional. The line on the quiz tile. Empty lists the answer names, which is usually right.
      - label: Article this quiz belongs to
        name: relatedPost
        widget: relation
        collection: posts
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        # Always a search box. The default threshold of 5 draws radios and checkboxes
        # below it, which reads as a broken control and does not survive twenty posts.
        dropdown_threshold: 0
        required: false
        hint: Optional — linked from the result screen.
      - label: Footnote under the result
        name: resultFootnote
        widget: text
        required: false
        hint: Optional quiet line after the answer, e.g. what a quiz can't know about your project.

      # --- Dates -----------------------------------------------------------
      - label: Last corrected
        name: updated
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
        hint: Only when you correct a published quiz.

      # --- Search and sharing. No photo alt text: a quiz has no hero photograph. -----
      - label: Share picture
        name: socialImage
        widget: string
        required: true
        default: /og-default.png
        hint: The picture shown when someone shares the page. Leave it as it is for now.
      - label: Preview address
        name: previewId
        widget: uuid
        hint: Made for you. While this is a draft, the page lives at this hidden address instead of its real one.

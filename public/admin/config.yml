# Sveltia CMS — admin panel at /admin
#
# The fields here mirror the Zod schemas in src/content.config.ts. When you change one,
# change the other: the schema is the enforcement (the build fails), this file is the
# form. Fields marked `required: true` here are the ones Zod would reject, so the panel
# asks at write time instead of the build failing afterwards.

# The deployed site. Without this the panel has nowhere to link an entry to, which is why
# there was no way out of /admin to look at a page.
#
# Drafts render on the site — they are only kept out of search, the sitemap and the feed —
# so this link is a real preview: save, follow it, and the draft banner at the top of the
# page tells you whether the build has caught up with your save yet.
#
# ⚠ Changing the domain means changing this, `site` in astro.config.mjs, and the Sitemap:
# line in public/robots.txt. All three, together.
site_url: https://hookd-blog.sklocheva.workers.dev
display_url: https://hookd-blog.sklocheva.workers.dev

backend:
  name: github
  repo: sklocheva/hookd
  branch: main
  # Authorization Code Flow needs an OAuth client — see README "Publishing from the browser".
  # Until one is deployed, sign in with a Personal Access Token instead, which needs no setup.
  # base_url: https://<your-auth-worker>.workers.dev

# Uploads land in src/assets/ so Astro can optimize them at build, rather than in
# public/ where they would be served untouched.
#
# public_folder is the path written into frontmatter. Sveltia requires an absolute
# path starting with "/" — a relative one is rejected outright — so entries store
# "/src/assets/<file>" and src/lib/images.ts resolves that to a real asset for
# <Image>. See the comment there for why the resolver exists.
media_folder: /src/assets
public_folder: /src/assets

media_libraries:
  all:
    # House rule: nothing above 2000px on the long edge gets committed, because git keeps
    # every version of every binary forever. Sveltia resizes in the browser before upload,
    # so the oversized original never enters the repo at all.
    transformations:
      raster_image:
        format: webp
        quality: 85
        width: 2000
        height: 2000

collections:
  # ---------------------------------------------------------------- patterns
  - name: patterns
    label: Free patterns
    label_singular: Pattern
    folder: src/content/patterns
    create: true
    extension: mdx
    format: frontmatter
    slug: '{{fields.title | slugify}}'
    summary: '{{title}} — {{difficulty}}'
    preview_path: patterns/{{slug}}
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - label: Last corrected
        name: updated
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
        hint: >-
          Set this when you fix something in a published pattern — a stitch count, a
          measurement. Leave empty until then.
      - label: Summary
        name: summary
        widget: text
        hint: The standfirst under the title. Two sentences at most.

      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: >-
          Draft entries still appear on the site but are kept out of Google, the sitemap
          and the RSS feed. Use it for anything not ready to be found.

      # --- SEO. Required, deliberately. ---------------------------------
      - label: Meta description
        name: metaDescription
        widget: string
        required: true
        pattern: ['^.{1,160}$', 'Must be 160 characters or fewer.']
        hint: Max 160 characters. The build fails without this.
      - label: Hero image
        name: heroImage
        widget: image
        required: false
        hint: Leave empty and the pattern shows "photography still to come" — it stays published and usable.
      - label: Hero image alt text
        name: heroImageAlt
        widget: string
        required: true
        hint: Describe the photo for someone who cannot see it. Required even before the photo exists.
      - label: Social share image
        name: socialImage
        widget: string
        required: true
        default: /og-default.png
        hint: Root-relative path under public/. Leave as /og-default.png until this entry has its own artwork — the build checks the file exists.
      - label: More photographs
        name: gallery
        widget: list
        required: false
        label_singular: Photograph
        summary: '{{fields.alt}}'
        hint: >-
          Extra shots, shown as a gallery below the pattern. The hero image stays separate
          and is always the first thing anyone sees.
        fields:
          - { label: Image, name: image, widget: image }
          - label: Alt text
            name: alt
            widget: string
            required: true
            hint: Describe the photo for someone who cannot see it. Required, like the hero's.
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: >-
              The line shown under the photo, e.g. "Size M, worn with 12 cm ease". Say
              something the photo cannot — not a repeat of the alt text.
      - label: Hero caption
        name: heroImageCaption
        widget: string
        required: false
        hint: Caption for the hero photo, which is the gallery's first frame.
      - label: Shoot note
        name: heroImagePending
        widget: string
        required: false
        hint: Shown when there is no hero image, e.g. "Shoot booked · September".

      # --- Classification ------------------------------------------------
      - label: Difficulty
        name: difficulty
        widget: select
        options: [Basic, Easy, Intermediate, Complex]
        hint: Craft Yarn Council's four levels. Drawn as four bars on the card.
      # Several per pattern — a hooded scarf is both clothing and an accessory. Stored as
      # lowercase slugs; the labels a reader sees live in src/lib/taxonomy.ts.
      - label: Type
        name: category
        widget: select
        multiple: true
        required: true
        min: 1
        options:
          - { label: Clothing, value: clothing }
          - { label: Accessories, value: accessories }
          - { label: Pets, value: pets }
          - { label: Home, value: home }
        hint: Tick every one that applies. At least one — the build fails on none.
      - label: Terms
        name: terms
        widget: select
        options: [US, UK]
        default: US
      - { label: Tags, name: tags, widget: list, required: false }

      # --- Yarn. A list, because colour-blocked work uses several. --------
      - label: Yarns
        name: yarns
        widget: list
        label_singular: Yarn
        summary: '{{fields.brand}} {{fields.line}} ({{fields.role}})'
        fields:
          - { label: Brand, name: brand, widget: string }
          - { label: Line, name: line, widget: string }
          - { label: Fibre content, name: fibreContent, widget: string, hint: 'e.g. 100% Norwegian wool' }
          - { label: Ball weight (g), name: ballWeightG, widget: number, value_type: int }
          - { label: Ball length (m), name: ballLengthM, widget: number, value_type: int }
          - label: CYC weight category
            name: cycWeight
            widget: number
            value_type: int
            min: 0
            max: 7
          - { label: CYC weight name, name: cycWeightName, widget: string, hint: 'e.g. Medium (worsted/aran)' }
          - { label: Colour name, name: colourName, widget: string, required: false }
          - { label: Role, name: role, widget: string, default: main, hint: 'main, contrast, optional…' }

      # --- Hook ----------------------------------------------------------
      # Only the mm is typed. The US size is looked up from it at build time
      # (src/lib/hooks.ts) because letters vary by manufacturer, and 2.5, 7 and 12 mm
      # have no US equivalent at all — a field for it invites an invented answer.
      - label: Hook (mm)
        name: hookMm
        widget: number
        value_type: float
        hint: The US size is added automatically. Nothing to look up.
      - { label: Second hook (mm), name: secondHookMm, widget: number, value_type: float, required: false }
      - { label: Second hook used for, name: secondHookFor, widget: string, required: false, hint: 'e.g. bands and cuffs' }

      # --- Gauge. Measured on the actual piece, after blocking. -----------
      - label: Gauge
        name: gauge
        widget: object
        hint: >-
          Measured on the actual piece after blocking, under its own weight — not on a
          swatch pinned flat.
        fields:
          - { label: Stitches, name: stitches, widget: number, value_type: float }
          - { label: Rows, name: rows, widget: number, value_type: float }
          - { label: Measured over (cm), name: overCm, widget: number, value_type: int, default: 10 }
          - { label: Stitch pattern, name: stitchPattern, widget: string }
          - { label: Blocked, name: blocked, widget: boolean, default: true }
          - label: Note
            name: note
            widget: string
            required: false
            hint: >-
              Where on the piece you measured. Worth writing: it is what tells a maker how
              to swatch so their number matches yours.

      # --- Sizes. Structured, so the table is generated. ------------------
      - label: Sizes
        name: sizes
        widget: list
        label_singular: Size
        summary: '{{fields.name}} — {{fields.yardageM}} m'
        hint: The finished-measurements table is generated from this, so it must be data, not prose.
        fields:
          - { label: Size name, name: name, widget: string, hint: 'XS, M, 3X, One size…' }
          - label: Fits body (cm)
            name: fitsBodyCm
            widget: string
            required: false
            hint: >-
              The body this size is cut for, e.g. 76–81. Shown next to the finished
              measurements so a maker can see the ease instead of working it out.
          - label: Finished measurements
            name: measurements
            widget: list
            required: false
            label_singular: Measurement
            summary: '{{fields.label}} — {{fields.value}}'
            hint: >-
              Name each one yourself: bust and length for a sweater, circumference and
              depth for a hat, nothing at all for a blanket. Use the same labels in every
              size — they become the table columns.
            fields:
              - { label: Label, name: label, widget: string, hint: 'e.g. Finished bust' }
              - { label: Value, name: value, widget: number, value_type: float }
              - { label: Unit, name: unit, widget: string, default: cm, required: false }
          - { label: Yardage (m), name: yardageM, widget: number, value_type: int }
      - { label: Ease, name: ease, widget: string, required: false, hint: 'e.g. worn with 10–15 cm ease' }
      - label: How to choose a size
        name: sizeNote
        widget: text
        required: false
        hint: >-
          Your own guidance — which measurement to go by, what to do between two sizes.
          Shown above the size table. Leave empty for a sensible default.
      - label: Body measurement chart
        name: bodyChartUrl
        widget: string
        required: false
        default: https://www.craftyarncouncil.com/standards/body-sizing
        hint: >-
          Linked from the sizing note. The Craft Yarn Council chart is the industry
          reference and includes an ease table — change it only to point somewhere better.

      # --- Links ----------------------------------------------------------
      - { label: Ravelry URL, name: ravelryUrl, widget: string, required: false }
      - { label: PDF URL, name: pdfUrl, widget: string, required: false }
      - label: Related journal post
        name: relatedPost
        widget: relation
        collection: posts
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        required: false
        hint: The test that justifies this pattern's yarn advice. Linked from the substitution note.

      # --- Read next. Optional: leave empty and the site picks by shared tags. ------
      - label: Related patterns
        name: relatedPatterns
        widget: relation
        collection: patterns
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        multiple: true
        required: false
        hint: >-
          Shown at the foot of the page under "read next". Your picks come first, in this
          order. Leave empty and the site fills the strip from shared tags.
      - label: Related journal posts
        name: relatedPosts
        widget: relation
        collection: posts
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        multiple: true
        required: false
        hint: The test behind a pattern is the most useful thing to link here.

      - { label: Body, name: body, widget: markdown }

  # ---------------------------------------------------------------- posts
  - name: posts
    label: Journal
    label_singular: Journal post
    folder: src/content/posts
    create: true
    extension: mdx
    format: frontmatter
    slug: '{{fields.title | slugify}}'
    summary: '{{title}} — {{kind}}'
    preview_path: journal/{{slug}}
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - { label: Updated, name: updated, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, required: false }
      - { label: Summary, name: summary, widget: text }
      - label: Kind
        name: kind
        widget: select
        options: ['Garment making', 'Yarn notes', 'How-tos']
        hint: Drives the eyebrow colour and the journal filters.

      - label: Draft
        name: draft
        widget: boolean
        default: false
        hint: >-
          Draft entries still appear on the site but are kept out of Google, the sitemap
          and the RSS feed. Use it for anything not ready to be found.

      # --- SEO. Required, deliberately. ---------------------------------
      - label: Meta description
        name: metaDescription
        widget: string
        required: true
        pattern: ['^.{1,160}$', 'Must be 160 characters or fewer.']
        hint: Max 160 characters. The build fails without this.
      - { label: Hero image, name: heroImage, widget: image, required: false }
      - label: Hero image alt text
        name: heroImageAlt
        widget: string
        required: true
      - label: More photographs
        name: gallery
        widget: list
        required: false
        label_singular: Photograph
        summary: '{{fields.alt}}'
        hint: >-
          Extra shots, shown as a gallery on the entry page. The hero image stays separate
          and is always the first thing anyone sees.
        fields:
          - { label: Image, name: image, widget: image }
          - label: Alt text
            name: alt
            widget: string
            required: true
            hint: Describe the photo for someone who cannot see it. Required, like the hero's.
          - label: Caption
            name: caption
            widget: string
            required: false
            hint: >-
              The line shown under the photo. Say something the photo cannot — not a repeat
              of the alt text.
      - label: Social share image
        name: socialImage
        widget: string
        required: true
        default: /og-default.png
        hint: Root-relative path under public/. Leave as /og-default.png until this entry has its own artwork — the build checks the file exists.

      - label: Method
        name: method
        widget: string
        required: false
        hint: 'The muted line under the excerpt, e.g. "6 yarns · 32 sts × 24 rows hdc".'
      - { label: Tags, name: tags, widget: list, required: false }
      # --- Read next. Optional: leave empty and the site picks by shared tags. ------
      - label: Related patterns
        name: relatedPatterns
        widget: relation
        collection: patterns
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        multiple: true
        required: false
        hint: >-
          Shown at the foot of the page under "read next". Your picks come first, in this
          order. Leave empty and the site fills the strip from shared tags.
      - label: Related journal posts
        name: relatedPosts
        widget: relation
        collection: posts
        search_fields: [title]
        value_field: '{{slug}}'
        display_fields: [title]
        multiple: true
        required: false
        hint: The test behind a pattern is the most useful thing to link here.

      - { label: Body, name: body, widget: markdown }

  # ---------------------------------------------------------------- reviews
  # A yarn note is a spec sheet with a short essay at the end — the mirror of a test note,
  # which is an essay with tables in it. Hence its own collection: almost none of the
  # fields overlap. Called notes, not reviews: this is writing down what a yarn did.
  #
  # NOTHING here is required by the panel, so a half-filled draft always saves. What a
  # *published* review needs is enforced by the schema instead — see the superRefine in
  # src/content.config.ts. Untick Draft and the build names anything still missing.
  - name: reviews
    label: Yarn notes
    label_singular: Yarn note
    folder: src/content/reviews
    create: true
    extension: md
    format: frontmatter
    slug: '{{fields.title | slugify}}'
    summary: '{{title}}'
    preview_path: journal/yarn/{{slug}}
    fields:
      - label: Yarn name
        name: title
        widget: string
        hint: As you would say it, e.g. Nordfjord Fjellull DK
      - { label: Publish date, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false }
      - label: Last corrected
        name: updated
        widget: datetime
        date_format: 'YYYY-MM-DD'
        time_format: false
        required: false
      - label: Draft
        name: draft
        widget: boolean
        default: true
        hint: >-
          Leave ticked while you work — a draft saves with whatever you have. Untick it
          when the review is ready, and the build will tell you if anything is missing.
      - label: Standfirst
        name: standfirst
        widget: text
        required: false
        hint: >-
          One or two sentences giving the answer. Someone who reads only this should know
          whether to buy the yarn — it replaces a verdict section.

      # --- SEO. Required to publish, not to save. -----------------------
      - label: Meta description
        name: metaDescription
        widget: string
        required: false
        pattern: ['^.{0,160}$', 'Must be 160 characters or fewer.']
      - label: Social share image
        name: socialImage
        widget: string
        required: false
        default: /og-default.png

      # --- Photos. Both optional even when published: a review with neither
      #     is a finished page, and early reviews go out before any shoot. ---
      - { label: Yarn photo, name: heroImage, widget: image, required: false }
      - label: Yarn photo alt text
        name: heroImageAlt
        widget: string
        required: false
        hint: Describe it for someone who cannot see it. Needed to publish, even before the photo exists.
      - label: Yarn photo caption
        name: heroImageCaption
        widget: string
        required: false
        hint: e.g. Shade 118 Kalkstein, one 50 g ball.
      - { label: Swatch photo, name: swatchImage, widget: image, required: false }
      - { label: Swatch photo alt text, name: swatchImageAlt, widget: string, required: false }
      - { label: Swatch photo caption, name: swatchImageCaption, widget: string, required: false }

      # --- Table 1: transcribed from the ball band and the shop. ---------
      #     Any row left empty simply does not appear on the page.
      - label: The yarn
        name: yarn
        widget: object
        fields:
          - { label: Brand, name: brand, widget: string, required: false }
          - { label: Line, name: line, widget: string, required: false }
          - label: Content
            name: content
            widget: string
            required: false
            hint: >-
              Just the fibres, e.g. "50% cotton, 50% merino wool". Ply belongs in Strand
              construction, and superwash is already implied by the care line.
          - label: Weight, as the label says
            name: weightLabel
            widget: string
            required: false
            hint: >-
              Copy the band's own word — "Worsted", "DK / 8 ply". No CYC number: bands
              disagree with the CYC scale and with each other, so a number would mean
              deciding who is right.
          - label: WPI
            name: wpi
            widget: number
            value_type: float
            required: false
            hint: >-
              Wraps per inch, if you measured it. Wrap the yarn round a ruler for an inch
              without stretching or overlapping, and count. This is the thickness measured
              rather than claimed — useful when two shops sell the same yarn as different
              weights.

          # How the strand is built. The type is a short fixed list so two reviews can be
          # compared on it; the note carries what you actually see when you untwist it.
          - label: Strand construction
            name: construction
            widget: object
            required: false
            collapsed: true
            fields:
              - label: Type
                name: type
                widget: select
                required: false
                options:
                  - Singles
                  - Plied
                  - Cabled
                  - Chainette
                  - Roving
                hint: >-
                  Singles — one unplied strand. Plied — strands twisted together. Cabled —
                  plied yarns plied together again. Chainette — fine plies braided into a
                  hollow tube. Roving — barely twisted at all.
              - label: What you see
                name: note
                widget: text
                required: false
                hint: >-
                  Untwist a length and describe it. e.g. "Two strands, cotton and merino,
                  twisted into a tweedy 2-ply; six of those twisted together again."

          - { label: Ball weight (g), name: ballWeightG, widget: number, value_type: int, required: false }
          - label: Ball length (m)
            name: ballLengthM
            widget: number
            value_type: int
            required: false
            hint: Yards are worked out for you.
          - label: Ball-band gauge
            name: ballBandGauge
            widget: string
            required: false
            hint: Copy it as printed, knitted figures and all.
          - label: Hook on label
            name: hookOnLabel
            widget: string
            required: false
            hint: What the band suggests, e.g. "3.5–4.5 mm".
          - label: Hook I used
            name: hookMm
            widget: number
            value_type: float
            required: false
            hint: >-
              The US size is added automatically where one exists. Several common sizes have
              no US equivalent in the Craft Yarn Council table — 2.5, 3, 7 and 12 mm — and
              those show the millimetres alone rather than an invented letter.
          - label: Grams per 10 × 10 cm
            name: gramsPer10cm
            widget: number
            value_type: float
            required: false
            hint: Measured from your swatch. Squares per ball is worked out from it.
          - { label: Metres per 10 × 10 cm, name: metresPer10cm, widget: number, value_type: float, required: false }
          - { label: Care, name: care, widget: string, required: false }


      # --- Where it comes from. Its own section, not five more fields buried at the
      #     bottom of a twenty-field yarn block where nobody could find them. ---
      - label: Where it comes from
        name: origin
        widget: object
        collapsed: false
        hint: Fill in whatever the band actually says. Anything left empty is simply absent from the page.
        fields:
          - label: Fibre from
            name: fibreOrigin
            widget: string
            required: false
            hint: >-
              Where the raw material came from. e.g. "Wool from South America, cotton from
              Turkey". Often a different country from where it was spun.
          - label: Made in
            name: madeIn
            widget: string
            required: false
            hint: Where it was spun and milled.
          - label: OEKO-TEX® STANDARD 100 class
            name: oekoTexClass
            widget: number
            value_type: int
            min: 1
            max: 4
            required: false
            hint: >-
              1 = babies and children to 3 · 2 = direct skin contact · 3 = no direct skin
              contact · 4 = decoration. It means the article was tested for harmful
              substances — it is NOT an organic or environmental label. Leave empty if the
              band does not say.
          - label: Mulesing
            name: mulesing
            widget: select
            required: false
            options:
              - Mulesing-free
              - Not stated
            hint: >-
              Animal fibres only, and only what the band or maker actually states. Most
              labels are silent — "Not stated" is the honest answer, and is not a claim
              either way. Leave empty for plant fibres.

      # --- Price as a position, never a figure. --------------------------
      - label: Price
        name: price
        widget: object
        hint: >-
          Where it sits in the market, 1 budget to 5 premium. Never a currency figure —
          prices change and vary by country, the position does not.
        fields:
          - { label: Level, name: level, widget: number, value_type: int, min: 1, max: 5, required: false }
          - label: Why
            name: note
            widget: string
            required: false
            hint: One line, e.g. Mid — about what a plain undyed wool of this quality costs.

      # --- The gauge panel: only ever unblocked vs blocked. --------------
      - label: My gauge
        name: gauge
        widget: object
        hint: >-
          Only these two figures. Washed and hung numbers were tried and cut — they
          duplicate the blocked figure and bury the comparison.
        fields:
          - { label: Unblocked, name: unblocked, widget: string, required: false, hint: 'Stitches × rows, e.g. 17.5 × 11' }
          - { label: Blocked, name: blocked, widget: string, required: false, hint: 'e.g. 16.5 × 10.5' }
          - label: Method
            name: method
            widget: string
            required: false
            hint: e.g. Over 10 × 10 cm · half double crochet · 4 mm hook
          - { label: What the change means, name: note, widget: text, required: false }

      # --- Table 2: the same six judgements on every review. -------------
      - label: What these notes are based on
        name: inTheHandBasis
        widget: string
        required: false
        hint: e.g. My notes, one swatch and one hat
      - label: In the hand
        name: inTheHand
        widget: object
        hint: >-
          The same six on every review, so two yarns can be read against each other.
          **More bars is always better**, except Drape, which runs structured to fluid. All
          six are needed to publish — with one missing, two reviews no longer compare. A
          score of 1–5 and one short sentence; a score with no reason is an opinion with a
          number stuck on it.
        fields:
          - label: Stitch definition
            name: stitchDefinition
            widget: object
            collapsed: true
            fields:
              - { label: Score, name: score, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: Note, name: note, widget: string, required: false }
          - label: Split resistance
            name: splitResistance
            widget: object
            collapsed: true
            hint: More bars = splits less. A yarn that splits badly scores 1.
            fields:
              - { label: Score, name: score, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: Note, name: note, widget: string, required: false }
          - label: Softness
            name: softness
            widget: object
            collapsed: true
            fields:
              - { label: Score, name: score, widget: number, value_type: int, min: 1, max: 5, required: false }
              - { label: Note, name: note, widget: string, required: false }
          - label: Next to skin
            name: nextToSkin
            widget: object
            collapsed: true
            hint: More bars = kinder on skin. Prickly scores 1. This is not the same as Softness — a yarn can feel soft in the hand and still scratch a neck.
            fields:
